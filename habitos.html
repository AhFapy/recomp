<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1f15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Hábitos · Jabner</title>
<link rel="stylesheet" href="/jabner.css">
<style>
.hoy-area{display:flex;flex-direction:column;gap:8px}
.hoy-area+.hoy-area{border-top:1px solid var(--line);padding-top:14px}
.hrow{display:flex;align-items:center;gap:10px;min-height:48px}
.hrow span{flex:1;min-width:0;font-weight:500}
.vr{display:flex;gap:6px}
.vr button{width:48px;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);font-size:17px;font-weight:600;cursor:pointer}
.vr button.v[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.vr button.r[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav button{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer}
.mesnav strong{min-width:110px;text-align:center}
.cart{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-20px;padding-inline:20px}
.cart table{border-collapse:separate;border-spacing:3px;font-size:12px}
.cart th{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}
.cart th.hoy{color:var(--ink);font-weight:700}
.cart td.n{position:sticky;left:0;background:var(--card);padding-right:8px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:13px;z-index:1}
.cart tr.area td{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.cart button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card2);cursor:pointer;padding:0}
.cart button.v{background:var(--brand);border-color:var(--brand)}
.cart button.r{background:var(--bad);border-color:var(--bad)}
.cart button.fut{opacity:.35}
.cart td.pct{color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px}
.edit{display:flex;align-items:center;gap:8px;min-height:40px}
.edit span{flex:1}
.edit button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;min-height:40px;padding:0 6px}
.nueva{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.nueva{grid-template-columns:160px 1fr auto}}
</style>
</head>
<body>
<main class="login" id="login" hidden>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#c5ff5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
  <h1 style="font-size:34px">Jabner</h1>
  <p class="muted" style="margin:0">Ábrela una vez desde el enlace privado que te pasó Ahmed. Después este móvil la recuerda.</p>
</main>
<div class="wrap" id="app" hidden>
  <header id="cabecera"></header>
  <p class="offline" id="offline" hidden>No se pudo conectar con la base de datos. Revisa la conexión y recarga.</p>
  <section class="grid" style="grid-template-columns:1fr">
    <div class="card">
      <div class="card-head"><h2>Hoy</h2><span class="chip num" id="score">—</span></div>
      <div id="hoy"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Cartulina</h2>
        <div class="mesnav"><button type="button" id="mPrev" aria-label="Mes anterior">‹</button><strong id="mLabel"></strong><button type="button" id="mNext" aria-label="Mes siguiente">›</button></div>
      </div>
      <div class="cart" id="cart"></div>
      <p class="tiny">Toca una casilla: verde, rojo, vacía.</p>
    </div>
    <details class="card">
      <summary><div class="t"><h2>Editar hábitos</h2><small>Mente, cuerpo, alma y objetivos</small></div><span class="chev" aria-hidden="true">⌄</span></summary>
      <div class="sub">
        <div id="lista"></div>
        <form class="nueva" id="nueva">
          <select id="nArea" aria-label="Área"><option value="mente">Mente</option><option value="cuerpo">Cuerpo</option><option value="alma">Alma</option><option value="objetivos">Objetivos</option></select>
          <input id="nNom" type="text" maxlength="60" placeholder="Nuevo hábito" required>
          <button class="cta" type="submit">Añadir</button>
        </form>
      </div>
    </details>
  </section>
</div>
<script src="/vendor/supabase.js"></script>
<script src="/jabner.js"></script>
<script src="/habitos.js"></script>
</body>
</html>
