<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1f15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Hábitos · Jabner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/jabner.css">
<style>
.hoy-area{display:flex;flex-direction:column;gap:8px}
.hoy-area+.hoy-area{border-top:1px solid var(--line);padding-top:14px}
.hrow{display:flex;align-items:center;gap:10px;min-height:48px}
.hrow span{flex:1;min-width:0;font-weight:500}
.vr{display:flex;gap:6px}
.vr button{width:48px;height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);font-size:17px;font-weight:600;cursor:pointer}
.vr button.v[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.vr button.r[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.mesnav{display:flex;align-items:center;gap:8px}
.mesnav button{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer}
.mesnav strong{min-width:110px;text-align:center}
.cart{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-20px;padding-inline:20px}
.cart table{border-collapse:separate;border-spacing:3px;font-size:12px}
.cart th{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}
.cart th.hoy{color:var(--ink);font-weight:700}
.cart td.n{position:sticky;left:0;background:var(--card);padding-right:8px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:13px;z-index:1}
.cart tr.area td{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.cart button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card2);cursor:pointer;padding:0}
.cart button.v{background:var(--brand);border-color:var(--brand)}
.cart button.r{background:var(--bad);border-color:var(--bad)}
.cart button.fut{opacity:.35}
.cart td.pct{color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px}
.edit{display:flex;align-items:center;gap:8px;min-height:40px}
.edit span{flex:1}
.edit button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px;min-height:40px;padding:0 6px}
.nueva{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:600px){.nueva{grid-template-columns:160px 1fr auto}}
</style>
</head>
<body>
<main class="login" id="login" hidden>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#c5ff5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
  <h1 style="font-size:34px">Jabner</h1>
  <p class="muted" style="margin:0">Ábrela una vez desde el enlace privado que te pasó Ahmed. Después este móvil la recuerda.</p>
</main>
<div class="wrap" id="app" hidden>
  <header id="cabecera"></header>
  <p class="offline" id="offline" hidden>No se pudo conectar con la base de datos. Revisa la conexión y recarga.</p>
  <section class="grid" style="grid-template-columns:1fr">
    <div class="card">
      <div class="card-head"><h2>Hoy</h2><span class="chip num" id="score">—</span></div>
      <div id="hoy"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Cartulina</h2>
        <div class="mesnav"><button type="button" id="mPrev" aria-label="Mes anterior">‹</button><strong id="mLabel"></strong><button type="button" id="mNext" aria-label="Mes siguiente">›</button></div>
      </div>
      <div class="cart" id="cart"></div>
      <p class="tiny">Toca una casilla: verde, rojo, vacía.</p>
    </div>
    <details class="card">
      <summary><div class="t"><h2>Editar hábitos</h2><small>Mente, cuerpo, alma y objetivos</small></div><span class="chev" aria-hidden="true">⌄</span></summary>
      <div class="sub">
        <div id="lista"></div>
        <form class="nueva" id="nueva">
          <select id="nArea" aria-label="Área"><option value="mente">Mente</option><option value="cuerpo">Cuerpo</option><option value="alma">Alma</option><option value="objetivos">Objetivos</option></select>
          <input id="nNom" type="text" maxlength="60" placeholder="Nuevo hábito" required>
          <button class="cta" type="submit">Añadir</button>
        </form>
      </div>
    </details>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="/jabner.js"></script>
<script>
const AREAS=[['mente','Mente'],['cuerpo','Cuerpo'],['alma','Alma'],['objetivos','Objetivos']];
let mes=hoy().slice(0,7), habitos=[], log={};  // log[habito|fecha]=true/false
const k=(h,f)=>h+'|'+f;
const diasMes=m=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};

async function cargar(){
  const pedido=uid, desde=mes+'-01', hasta=mes+'-'+pad(diasMes(mes));
  const t=hoy(), ini=t<desde?t:desde, fin=t>hasta?t:hasta;
  const [h,l]=await Promise.all([
    SB.from('jabner_habitos').select('id,area,nombre,orden').eq('profile_id',pedido).eq('activo',true).order('orden').order('created_at'),
    SB.from('jabner_habitos_log').select('habito_id,fecha,hecho').eq('profile_id',pedido).gte('fecha',ini).lte('fecha',fin),
  ]);
  if(pedido!==uid||fallo(h.error||l.error)) return;
  habitos=h.data; log={}; for(const r of l.data) log[k(r.habito_id,r.fecha)]=r.hecho;
  render();
}
async function marcar(id,f,val){
  const prev=log[k(id,f)];
  if(val==null) delete log[k(id,f)]; else log[k(id,f)]=val;
  render();
  const q=val==null
    ? SB.from('jabner_habitos_log').delete().eq('habito_id',id).eq('fecha',f)
    : SB.from('jabner_habitos_log').upsert({habito_id:id,profile_id:uid,fecha:f,hecho:val});
  const {error}=await q;
  if(fallo(error)){ if(prev==null) delete log[k(id,f)]; else log[k(id,f)]=prev; render(); }
}
function render(){
  const t=hoy();
  // Hoy
  let html='', verdes=0;
  for(const [a,n] of AREAS){
    const hs=habitos.filter(h=>h.area===a); if(!hs.length) continue;
    html+=`<div class="hoy-area"><span class="label">${n}</span>`;
    for(const h of hs){
      const v=log[k(h.id,t)]; if(v===true) verdes++;
      html+=`<div class="hrow"><span>${esc(h.nombre)}</span><div class="vr">
        <button type="button" class="v" data-h="${h.id}" data-val="1" aria-pressed="${v===true}" aria-label="Hecho">✓</button>
        <button type="button" class="r" data-h="${h.id}" data-val="0" aria-pressed="${v===false}" aria-label="No hecho">✕</button></div></div>`;
    }
    html+='</div>';
  }
  $('hoy').innerHTML=html||'<p class="muted" style="margin:0">Aún no tienes hábitos. Añádelos abajo en "Editar hábitos".</p>';
  $('score').textContent=habitos.length?`${verdes}/${habitos.length}`:'—';
  $('hoy').querySelectorAll('[data-h]').forEach(b=>b.addEventListener('click',()=>{
    const want=b.dataset.val==='1', cur=log[k(b.dataset.h,t)];
    marcar(b.dataset.h,t,cur===want?null:want);
  }));
  // Cartulina
  const [y,mm]=mes.split('-').map(Number), N=diasMes(mes);
  $('mLabel').textContent=new Date(y,mm-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(' de ',' ').replace(/^./,c=>c.toUpperCase());
  $('mNext').disabled=mes>=t.slice(0,7);
  let c='<table><thead><tr><th></th>';
  for(let d=1;d<=N;d++){const f=`${mes}-${pad(d)}`;c+=`<th class="${f===t?'hoy':''}">${d}</th>`}
  c+='<th>%</th></tr></thead><tbody>';
  for(const [a,n] of AREAS){
    const hs=habitos.filter(h=>h.area===a); if(!hs.length) continue;
    c+=`<tr class="area"><td colspan="${N+2}">${n}</td></tr>`;
    for(const h of hs){
      c+=`<tr><td class="n" title="${esc(h.nombre)}">${esc(h.nombre)}</td>`;
      let si=0,tot=0;
      for(let d=1;d<=N;d++){
        const f=`${mes}-${pad(d)}`, v=log[k(h.id,f)];
        if(f<=t){tot++; if(v===true) si++;}
        c+=`<td><button type="button" data-c="${h.id}" data-f="${f}" class="${v===true?'v':v===false?'r':''}${f>t?' fut':''}" ${f>t?'disabled':''} aria-label="${esc(h.nombre)} ${d}"></button></td>`;
      }
      c+=`<td class="pct">${tot?Math.round(si/tot*100):0}</td></tr>`;
    }
  }
  c+='</tbody></table>';
  $('cart').innerHTML=habitos.length?c:'';
  $('cart').querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{
    const cur=log[k(b.dataset.c,b.dataset.f)];
    marcar(b.dataset.c,b.dataset.f,cur===undefined?true:cur===true?false:null);
  }));
  // Lista editable
  $('lista').innerHTML=AREAS.map(([a,n])=>{
    const hs=habitos.filter(h=>h.area===a);
    return `<div class="hoy-area" style="padding-bottom:8px"><span class="label">${n}</span>${hs.map(h=>`<div class="edit"><span>${esc(h.nombre)}</span><button type="button" data-del="${h.id}">Quitar</button></div>`).join('')||'<span class="tiny">—</span>'}</div>`;
  }).join('');
  $('lista').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    const {error}=await SB.from('jabner_habitos').update({activo:false}).eq('id',b.dataset.del);
    if(!fallo(error)) cargar();
  }));
}
$('nueva').addEventListener('submit',async e=>{
  e.preventDefault(); const nombre=$('nNom').value.trim(); if(!nombre) return;
  const area=$('nArea').value, orden=habitos.filter(h=>h.area===area).length+1;
  const {error}=await SB.from('jabner_habitos').insert({profile_id:uid,area,nombre,orden});
  if(!fallo(error)){$('nNom').value='';cargar()}
});
const mover=n=>{const [y,m]=mes.split('-').map(Number);const d=new Date(y,m-1+n,1);mes=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;cargar()};
$('mPrev').addEventListener('click',()=>mover(-1));
$('mNext').addEventListener('click',()=>mover(1));
jabner('Hábitos',cargar);
setTimeout(()=>{const c=$('cart');const th=c.querySelector('th.hoy');if(th)c.scrollLeft=th.offsetLeft-c.clientWidth/2},800);
</script>
</body>
</html>
