<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1f15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Jabner</title>
<link rel="stylesheet" href="/jabner.css">
</head>
<body>
<main class="login" id="login" hidden>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#c5ff5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
  <h1 style="font-size:34px">Jabner</h1>
  <p class="muted" style="margin:0">Cargando…</p>
</main>
<div class="wrap" id="app" hidden>
  <header id="cabecera"></header>
  <p class="offline" id="offline" hidden>No se pudo conectar con la base de datos. Revisa la conexión y recarga.</p>
  <section class="modulos">
    <a class="card modulo" href="/recomp">
      <div class="card-head"><span class="label">Recomp</span><span class="chip" id="rChip">—</span></div>
      <div class="big" id="rBig">—</div>
      <p id="rSub">Peso, comida y entreno</p>
      <div class="ir">Gimnasio y nutrición <span aria-hidden="true">›</span></div>
    </a>
    <a class="card modulo" href="/habitos">
      <div class="card-head"><span class="label">Hábitos</span><span class="chip" id="hChip">Hoy</span></div>
      <div class="big" id="hBig">—</div>
      <p id="hSub">La cartulina</p>
      <div class="ir">Marcar hoy <span aria-hidden="true">›</span></div>
    </a>
    <a class="card modulo" href="/finanzas">
      <div class="card-head"><span class="label">Finanzas</span><span class="chip" id="fChip">Este mes</span></div>
      <div class="big" id="fBig">—</div>
      <p id="fSub">Gastos e ingresos</p>
      <div class="ir">Ver movimientos <span aria-hidden="true">›</span></div>
    </a>
  </section>
</div>
<script src="/vendor/supabase.js"></script>
<script src="/jabner.js"></script>
<script src="/inicio.js"></script>
</body>
</html>
